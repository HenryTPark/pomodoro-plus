# Render Blueprint — Pomodoro Plus Django API + Celery worker
#
# Deploy: connect this repo in the Render dashboard and apply the blueprint,
# or create services manually with root directory "backend".
#
# Use Neon (free) for Postgres — paste DATABASE_URL in the Render env vars.
# https://neon.tech
#
# AI insights: free Key Value (Redis broker) + Starter worker. Set OPENAI_API_KEY
# (and optionally OPENAI_MODEL) on both the web and worker services.

services:
  - type: web
    name: pomodoro-plus-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_CALLBACK_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: pomodoro-plus-redis
          type: keyvalue
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: AI_INSIGHTS_DAILY_LIMIT
        value: "5"

  - type: worker
    name: pomodoro-plus-worker
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: ./build.sh
    startCommand: celery -A config worker --loglevel=info --concurrency=2
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        fromService:
          name: pomodoro-plus-api
          type: web
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: pomodoro-plus-redis
          type: keyvalue
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: AI_INSIGHTS_DAILY_LIMIT
        value: "5"

  - type: keyvalue
    name: pomodoro-plus-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []
